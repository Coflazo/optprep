name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Only what the browser loads; backend, engine, tests and tools stay out.
      # The service worker's cache name gets the commit SHA so each deploy replaces the old cache.
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R index.html app.js config src assets manifest.webmanifest sw.js .nojekyll _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" _site/sw.js
          grep -q "${GITHUB_SHA::12}" _site/sw.js
          # Every file the app can load goes into the offline cache on install.
          (cd _site && find src config assets -type f \( -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.woff2' -o -name '*.png' \) | LC_ALL=C sort) > files.txt
          node -e "const fs=require('fs');const f=fs.readFileSync('files.txt','utf8').trim().split('\n');const p='_site/sw.js';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('[/*FILES*/]',JSON.stringify(f)))"
          grep -q '"src/study/pages.js"' _site/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
