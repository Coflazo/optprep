<!doctype html>
<!-- GitHub social preview, 1280x640. Render: see the comment at the end of this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Roboto"; font-weight: 400 700; src: url("../assets/fonts/roboto-latin.woff2") format("woff2"); }
  @font-face { font-family: "Roboto Mono"; font-weight: 400 600; src: url("../assets/fonts/roboto-mono-latin.woff2") format("woff2"); }
  :root { --bg: #F4F7FA; --surface: #FFFFFF; --text: #0F2442; --text-2: #3C5B7C; --text-3: #4F6F91; --border: #CFE3F4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Roboto", system-ui, sans-serif; }
  .copy { position: absolute; left: 72px; top: 72px; bottom: 64px; width: 528px; display: flex; flex-direction: column; }
  .wordmark { height: 50px; width: auto; align-self: flex-start; }
  h1 { margin-top: 44px; font-size: 50px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; }
  .tasks { margin-top: 20px; font-size: 21px; line-height: 1.45; color: var(--text-2); }
  .foot { margin-top: auto; }
  .run { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 19px; color: var(--text); font-feature-settings: "tnum"; }
  .run span + span { margin-left: 24px; color: var(--text-2); }
  .note { margin-top: 8px; font-size: 15px; color: var(--text-3); }
  .shot { position: absolute; left: 664px; top: 72px; right: -1px; bottom: -1px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); border-radius: 6px 0 0 0; }
  .shot img { position: absolute; width: 893px; left: -186px; top: -14px; }
</style>
</head>
<body>
  <div class="copy">
    <img class="wordmark" src="../assets/wordmark.svg" alt="optprep">
    <h1>Free practice for the Optiver online assessment.</h1>
    <p class="tasks">80-in-8, Beat the Odds, NumberLogic, Likelihood List, Intervals, Orderbooks and Zap-N, on the real clocks.</p>
    <div class="foot">
      <p class="run"><span>coflazo.github.io/optprep</span><span>npx optprep</span></p>
      <p class="note">Free and open source. Not affiliated with Optiver.</p>
    </div>
  </div>
  <div class="shot"><img src="../docs/media/screens/today-light.png" alt=""></div>
</body>
</html>
